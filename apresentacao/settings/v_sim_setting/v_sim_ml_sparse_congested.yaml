# Scenario 5: Sparse but Congested - Few Heavy VNRs
# Characteristics:
# - Large VNRs (6-10 nodes)
# - Low arrival rate BUT high demands
# - Creates sparse but resource-intensive workload
# - Favors algorithms that handle complex placements

num_v_nets: 300  # For ML training

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 6                 # Large VNRs
  high: 10

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.03              # Low arrival but heavy demands
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 500

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 30              # High demand
    high: 80

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 60              # High demand
    high: 150

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
