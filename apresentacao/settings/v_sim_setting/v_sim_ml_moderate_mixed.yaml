# Scenario 7: Moderate Mixed - Mixed Demands
# Characteristics that create diverse outcomes:
# - Medium VNRs
# - Mixed demand range (low to high)
# - Moderate arrival rate
# - Tests algorithm adaptability

num_v_nets: 300  # For ML training

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 4                 # Medium range
  high: 7

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.06              # Moderate arrival
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 500

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 15              # Mixed demand range
    high: 50

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 30              # Mixed demand range
    high: 100

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
