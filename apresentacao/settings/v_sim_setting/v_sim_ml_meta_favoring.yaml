# Scenario 2: Meta-Heuristic Favoring - High Demand, Complex VNRs
# Characteristics that favor GA/SA meta-heuristics:
# - High total demands - needs sophisticated optimization
# - Extreme demand per node (4x normal)
# - High system load - complex constraints
# - Many competing VNRs

num_v_nets: 300  # For ML training

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 4                 # Medium VNRs
  high: 8

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.10              # High arrival rate - high congestion
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 500

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 50              # EXTREME demand (from Phase 1 analysis)
    high: 150

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 100             # EXTREME demand
    high: 400

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
