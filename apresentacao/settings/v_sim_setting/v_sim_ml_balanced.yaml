# Scenario 3: Balanced - Standard Workload
# Characteristics that create mixed algorithm performance:
# - Medium VNR sizes
# - Moderate demands
# - Medium system load
# - Standard arrival patterns

num_v_nets: 300  # For ML training

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 3                 # Medium range
  high: 7

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.05              # Medium arrival rate
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 500

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 10              # Moderate demand
    high: 40

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 20              # Moderate demand
    high: 80

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
