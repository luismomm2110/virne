# Physical Network Configuration - Fat-Tree Datacenter Topology
# Fat-Tree with k-port switches creates k^3/4 host nodes
# Example: k=4 creates 16 hosts + 20 switches (36 total nodes)
#         k=6 creates 54 hosts + 45 switches (99 total nodes)
#
# Topology structure (k=4):
#   - 16 hosts (layer='host') - have CPU resources
#   - 4 core switches (layer='core') - routing only, CPU=0
#   - 8 aggregation switches (layer='aggregation') - routing only, CPU=0
#   - 8 edge switches (layer='edge') - routing only, CPU=0

topology:
  num_nodes: 16               # Number of HOST nodes (k^3/4 where k=4)
  type: fat_tree              # Fat-Tree datacenter topology
  k: 4                        # Number of ports per switch (must be even)
                              # This creates 16 host nodes (4^3/4 = 16)
  wm_alpha: 0.5               # Not used for fat_tree, but required by config
  wm_beta: 0.2                # Not used for fat_tree, but required by config

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    high: 100
    low: 50
  - name: max_cpu
    type: extrema
    owner: node
    originator: cpu

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    high: 400
    low: 200
  - name: max_bw
    type: extrema
    owner: link
    originator: bw

output:
  save_dir: dataset/p_net
  file_name: fat_tree_p_net.gml
