# Physical Network Configuration - Medium Tree Topology
# Binary tree with 64 HOST nodes (leaf nodes)
# Total nodes: 64 hosts + 63 switches = 127 nodes
# Intermediate size between small (16) and large (128)

topology:
  num_nodes: 64              # Number of HOST nodes (leaf nodes)
  type: tree                 # Tree topology
  branching_factor: 2        # Binary tree (2 children per switch)
  wm_alpha: 0.5              # Not used for tree
  wm_beta: 0.2               # Not used for tree

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    high: 100
    low: 50
  - name: max_cpu
    type: extrema
    owner: node
    originator: cpu

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    high: 400
    low: 200
  - name: max_bw
    type: extrema
    owner: link
    originator: bw

output:
  save_dir: dataset/p_net
  file_name: medium_tree_p_net.gml
