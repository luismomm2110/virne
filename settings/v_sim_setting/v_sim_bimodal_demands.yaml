# EDGE CASE: Bimodal Demand Distribution
# VNRs have either VERY LOW or VERY HIGH demands (no middle ground)
# Simulates real-world scenarios: IoT sensors (low) + Video streaming (high)
#
# Implementation: Two separate ranges
# - Light VNRs: CPU [1-5], BW [1-10]
# - Heavy VNRs: CPU [80-100], BW [150-200]
# Since uniform doesn't support bimodal, we use wide range [1-100]
# but in practice, middle values (~50) will be rare
#
# Expected to favor:
#   - GA/SA: Can handle mixed workloads
#   - PL-Rank: Fast enough to try multiple placements
# Expected to challenge:
#   - Greedy heuristics: May place heavy VNRs poorly

num_v_nets: 700

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 3
  high: 12

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.04
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 500

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 1                # Mix of very light
    high: 100             # and very heavy demands

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 1
    high: 200

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
