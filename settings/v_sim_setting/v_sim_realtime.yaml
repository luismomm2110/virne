# EDGE CASE: Real-Time Processing
# High arrival rate simulating real-time system
# Must process VNRs quickly or queue backs up
# Expected to favor: rw_rank_bfs, pl_rank (fastest algorithms)

num_v_nets: 700

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 3                 # Small to medium VNRs
  high: 12

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.12              # VERY HIGH arrival rate (3x normal)
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 200             # SHORT lifetime (fast turnover)

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 5
    high: 20

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 10
    high: 40

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
