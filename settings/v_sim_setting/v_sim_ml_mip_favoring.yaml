# Scenario 1: MIP Favoring - Low Load, Small VNRs
# Characteristics that favor MIP optimal solutions:
# - Small VNRs (2-5 nodes) - MIP can solve optimally quickly
# - Low resource demands - plenty of capacity
# - Low system load - spare network capacity
# - Few competing VNRs - less contention

num_v_nets: 300  # Increased for ML training

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 2                 # Small VNRs
  high: 5

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.02              # Low arrival rate - less congestion
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 500

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 0               # Low demand
    high: 15

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 0               # Low demand
    high: 30

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
