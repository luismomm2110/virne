# Virtual Network Simulation Configuration - GA_Meta Favoring
# Complex VNRs with moderate-high saturation to favor GA_Meta over RW_Rank_BFS
# GA_Meta's genetic algorithm can explore solution space better than greedy heuristic
# in constrained, complex scenarios - but still maintains solvability

num_v_nets: 1000  # 1000 VNRs for statistical significance

topology:
  type: random           # Random topology for complexity
  random_prob: 0.70      # High connectivity (70%) = complex routing decisions

v_net_size:
  distribution: uniform  # Uniform distribution
  dtype: int
  low: 5                 # Medium size (more complex than 3-8)
  high: 11               # Balanced complexity

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.022             # Moderate-low arrival rate for feasibility
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 900             # Long lifetime - maintains resource pressure

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 5                # Moderate demands (solvable but challenging)
    high: 20              # Some heterogeneity

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 10               # Moderate demands
    high: 50              # Heterogeneous demands

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
