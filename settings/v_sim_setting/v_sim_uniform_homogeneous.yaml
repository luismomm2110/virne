# CONTROL SCENARIO: Homogeneous Demands (NARROW variation)
# All VNRs have very similar demands
# CPU [15-25], BW [40-60] - Only 10-20 unit variation
# This is the OPPOSITE of heterogeneous scenarios
#
# Expected behavior:
#   - Heuristics perform WELL (greedy works when all demands similar)
#   - GA/SA advantage DISAPPEARS (no optimization challenge)
#   - MIP overkill (optimal ≈ greedy on homogeneous demands)
#
# This control scenario helps prove that heterogeneity matters

num_v_nets: 700

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 4
  high: 12

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.04
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 500

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 15               # NARROW: Only 10 unit variation
    high: 25              # All nodes have similar demands

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 40               # NARROW: Only 20 unit variation
    high: 60              # All links have similar demands

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
