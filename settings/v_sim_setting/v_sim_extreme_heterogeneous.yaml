# EDGE CASE: Extreme Heterogeneous Demands
# VNRs with VERY wide demand variation (1-100 CPU, 1-200 BW)
# Mix of tiny, medium, and huge demands in same VNR
# This creates complex optimization problems that favor:
#   - GA/SA: Can balance heterogeneous placements
#   - MIP: Optimal but slow
# Heuristics struggle: Greedy ranking fails on heterogeneous demands

num_v_nets: 700

topology:
  type: random
  random_prob: 0.5

v_net_size:
  distribution: uniform
  dtype: int
  low: 5
  high: 15

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.04
  reciprocal: true

lifetime:
  distribution: exponential
  dtype: float
  scale: 600

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 1                # EXTREME: Some nodes need 1 CPU
    high: 100             # EXTREME: Some nodes need 100 CPU (100x variation!)

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 1                # EXTREME: Some links need 1 BW
    high: 200             # EXTREME: Some links need 200 BW (200x variation!)

graph_attrs_setting:

output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
