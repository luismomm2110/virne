defaults:
  - _self_
  - learning
  - v_sim_setting/v_sim_ml_balanced
  - p_net_setting/fat_tree_p_net_setting

hydra:
  run:
    dir: ./results
  job:
    name: virne
output_subdir: null

experiment:
  seed: 0
  run_id: auto
  num_simulations: 1
  save_root_dir: ccis/results/simulacoes/
  if_save_config: true
  if_save_p_net: true
  if_save_v_nets: true
  if_load_p_net: true
  if_load_v_nets: true

system:
  renew_v_net_simulator: false
  if_offline_system: false
  if_changeable_v_nets: false
  if_time_window: false
  time_window_size: 100

solver:
  solver_name: 'greedy_oracle'
  # Conjunto de candidatos disputado a cada requisição. Reduzir esta lista é o
  # meio recomendado de validar o mecanismo antes de uma execução completa.
  oracle_candidates:
    - pl_rank
    - rw_rank_bfs
    - d_round
    - sa_meta
    - ga_meta
    - pso_meta
    - mcts
    - mip
  # Limite de tempo, em segundos, dos candidatos baseados em programação
  # linear. O valor original do virne é 10 s, esgotado pelo mip em
  # praticamente toda instância, o que o torna responsável pela maior parte do
  # custo do oráculo. O ajuste vale apenas para as execuções deste pacote.
  candidate_time_limits:
    mip: 2
  matching_mathod: greedy
  shortest_method: k_shortest
  reusable: false
  node_ranking_method: order
  link_ranking_method: order
  k_shortest: 10
  allow_revocable: false
  allow_rejection: false
  sub_solver_name: null
  pretrained_model_path: ''
  pretrained_subsolver_model_path: ''
  computation_budget: 100
  exploration_constant: 1.0
  max_visit: 100
  max_depth: 10

recorder:
  record_dir_name: records
  if_save_records: true
  if_temp_save_records: true
  summary_file_name: summary.csv

logger:
  log_dir_name: logs
  project_name: 'virne'
  experiment_name: ccis_oracle_fat_tree
  level: INFO
  verbose: 1
  backends: ['console', 'file', 'tensorboard']
  log_show_interval: 20
  log_file_name: 'running.log'
